<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6f6">
<title>Box</title>
<link rel="stylesheet" href="static/style.css">
<link rel="manifest" href="static/manifest.webmanifest">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='26' fill='%231c1617'/><path d='M30 40l20-11 20 11v22L50 73 30 62z' fill='none' stroke='%23fbf6f6' stroke-width='6' stroke-linejoin='round'/><path d='M30 40l20 11 20-11M50 51v22' fill='none' stroke='%23fbf6f6' stroke-width='6' stroke-linejoin='round'/></svg>">
<script>
  // Apply the saved or system theme before first paint.
  try {
    const t = localStorage.getItem("box.theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<header class="topbar">
  <button class="logo-btn glass" id="logoBtn" title="All saves" aria-label="All saves">
    <svg viewBox="0 0 24 24"><path d="M4 8.2 12 4l8 4.2v7.6L12 20l-8-4.2z"/><path d="m4 8.2 8 4.3 8-4.3M12 12.5V20"/></svg>
  </button>

  <nav class="navpill glass" id="viewNav" aria-label="Views">
    <button data-view="all" class="active">All</button>
    <button data-view="unsorted">Unsorted</button>
    <button data-view="trash">Trash</button>
  </nav>

  <label class="searchpill glass">
    <span class="scope-chip" id="scopeChip"><span class="scope-thumb" id="scopeThumb"></span><span id="scopeName">Box</span></span>
    <input type="search" id="searchInput" placeholder="Search your Box…" autocomplete="off" enterkeyhint="search">
    <kbd class="kbd">/</kbd>
  </label>

  <div class="rightpill glass">
    <button class="status" id="statusBtn" title="Sync status"><span class="dot" id="statusDot"></span></button>
    <button class="create" id="addBtn">Add</button>
    <button class="menu-btn" id="menuBtn" aria-label="Collections and settings">
      <svg viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></svg>
    </button>
  </div>
</header>

<main class="page">
  <section class="hero">
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <h1 id="heroTitle">All saves</h1>
    <p class="meta" id="heroMeta">&nbsp;</p>
    <div class="tools" id="tools"></div>
    <nav class="kinds" id="kindTabs" aria-label="Filter by type">
      <button class="active" data-kind="">Everything</button>
      <button data-kind="article">Articles</button>
      <button data-kind="video">Videos</button>
      <button data-kind="image">Images</button>
      <button data-kind="file">Files</button>
      <button data-kind="note">Notes</button>
    </nav>
  </section>

  <section class="shelf" id="shelf" aria-label="Collections"></section>
  <h2 class="section-label" id="boardLabel" hidden>Latest saves</h2>
  <section class="board" id="board" aria-live="polite"></section>
  <div class="more" id="more" hidden>Loading more…</div>
</main>

<!-- Selection bar (select mode) -->
<div class="select-bar glass" id="selectBar" hidden>
  <span class="sel-count" id="selCount">0 selected</span>
  <div class="sel-actions" id="selActions"></div>
  <button class="btn ghost" id="selCancel">Done</button>
</div>

<!-- Collections drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Collections and settings">
  <div class="drawer-head">
    <span class="drawer-title">Your Box</span>
    <button class="icon-round" id="drawerClose" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg>
    </button>
  </div>
  <nav class="drawer-views" id="drawerViews"></nav>
  <div class="drawer-label">Collections <button class="link-btn" id="drawerNewCol">+ New</button></div>
  <ul class="tree" id="tree"></ul>
  <div class="drawer-foot">
    <div class="status-row" id="syncRow"><span class="dot"></span><span class="txt">Starting…</span></div>
    <button class="status-row clickable" id="backupRow" title="Back up now"><span class="dot"></span><span class="txt">Backup</span></button>
    <div class="foot-actions">
      <button class="chip-btn" id="themeBtn">Dark mode</button>
      <button class="chip-btn" id="exportBtn" title="Download everything in Box as a JSON file">Export</button>
      <button class="chip-btn" id="signOutBtn" hidden>Sign out</button>
    </div>
  </div>
</aside>

<!-- Item detail -->
<dialog id="dlgItem" class="sheet sheet-item">
  <div class="item-media" id="itemMedia"></div>
  <div class="item-body">
    <div class="item-src" id="itemSrc"></div>
    <div class="item-title-row" id="itemTitleRow">
      <h2 id="itemTitle"></h2>
      <button class="icon-sm" id="itemEditTitle" title="Edit title" aria-label="Edit title">
        <svg viewBox="0 0 24 24"><path d="m14.5 5.5 4 4L8 20H4v-4z"/><path d="m12.5 7.5 4 4"/></svg>
      </button>
    </div>
    <form class="item-title-edit" id="itemTitleForm" hidden>
      <input type="text" id="itemTitleInput" maxlength="200" required aria-label="Title" autocomplete="off">
      <button type="submit" class="btn primary">Save</button>
      <button type="button" class="btn ghost" id="itemTitleCancel">Cancel</button>
    </form>
    <div class="item-ai" id="itemAi"></div>
    <p class="item-desc" id="itemDesc"></p>
    <div class="item-more" id="itemMore"></div>
    <button class="item-col" id="itemCol"></button>
    <div class="item-actions" id="itemActions"></div>
  </div>
  <button class="icon-round sheet-close" data-close aria-label="Close">
    <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg>
  </button>
</dialog>

<!-- Add a link or note -->
<dialog id="dlgAdd" class="sheet">
  <form method="dialog">
    <h2>Save to Box</h2>
    <label class="field">Link or note<textarea id="addText" rows="3" required placeholder="Paste a link, or write a note" autocomplete="off"></textarea></label>
    <label class="field">Collection<select id="addParent"></select></label>
    <div class="sheet-actions">
      <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
      <button value="ok" class="btn primary">Save to Box</button>
    </div>
  </form>
</dialog>

<!-- New / rename collection -->
<dialog id="dlgCollection" class="sheet">
  <form method="dialog">
    <h2 id="colDlgTitle">New collection</h2>
    <label class="field">Name<input type="text" id="colName" required placeholder="e.g. Career" autocomplete="off"></label>
    <label class="field" id="colParentField">Inside<select id="colParent"></select></label>
    <div class="sheet-actions">
      <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
      <button value="ok" class="btn primary" id="colOk">Create</button>
    </div>
  </form>
</dialog>

<!-- Move -->
<dialog id="dlgMove" class="sheet">
  <h2>Move to…</h2>
  <div class="move-list" id="moveList"></div>
  <div class="sheet-actions"><button class="btn ghost" data-close>Cancel</button></div>
</dialog>

<!-- Confirm (replaces the browser's own confirm()) -->
<dialog id="dlgConfirm" class="sheet sheet-confirm">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p class="sheet-note" id="confirmBody"></p>
    <div class="sheet-actions">
      <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
      <button value="ok" class="btn primary" id="confirmOk">OK</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="static/config.js"></script>
<script src="static/app.js"></script>
</body>
</html>
