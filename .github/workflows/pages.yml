name: Pages

# Publishes the web UI (static/) to GitHub Pages. The UI connects to a Box server whose address and access
# token each visitor enters once; the server itself runs elsewhere (see deploy/).
on:
  push:
    branches: [main]
    paths: ["static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/static
          cp static/index.html _site/index.html
          cp -r static/. _site/static/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
