name: Pages

# Publishes the web UI (static/) to GitHub Pages, with the Box server's address from the repository variable
# BOX_SERVER. Each browser signs in once through a link Box sends in Telegram; the server runs elsewhere (deploy/).
on:
  push:
    branches: [main]
    paths: ["static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        env:
          BOX_SERVER: ${{ vars.BOX_SERVER }}   # repository variable: the Box server's https address
        run: |
          mkdir -p _site/static
          cp static/index.html _site/index.html
          cp static/sw.js _site/sw.js          # at the site root, so it covers the whole app
          cp -r static/. _site/static/
          printf 'window.BOX_SERVER = "%s";\n' "$BOX_SERVER" > _site/static/config.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
